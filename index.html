<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintCalc Pro</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00d1b2">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        .app-container { max-width: 450px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h2 { color: #00d1b2; text-align: center; margin-top: 0; font-weight: 300; }
        
        /* Switch per Modalità Calcolo */
        .mode-selector { display: flex; background: #262626; border-radius: 10px; margin-bottom: 20px; padding: 5px; }
        .mode-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 8px; transition: 0.3s; font-weight: bold; }
        .mode-btn.active { background: #00d1b2; color: #121212; }

        label { display: block; margin-top: 15px; color: #888; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select { 
            width: 100%; padding: 15px; margin-top: 8px; 
            border-radius: 12px; border: 2px solid #333; background: #262626; 
            color: white; font-size: 1.1em; box-sizing: border-box; outline: none;
        }
        
        input:focus, select:focus { border-color: #00d1b2; }

        .row { display: flex; gap: 10px; }
        .hidden { display: none; }
        
        .result-area { 
            margin-top: 25px; background: linear-gradient(135deg, #00d1b2, #009e86); color: #121212; 
            padding: 20px; border-radius: 15px; text-align: center; 
        }

        .result-val { font-size: 2.2em; font-weight: bold; display: block; }
        
        .buckets-info {
            margin-top: 15px; padding: 15px; background: #262626; border-radius: 12px;
            font-size: 0.9em; border-left: 4px solid #ff9800;
        }

        #installBtn { 
            display: none; width: 100%; padding: 15px; background: #ff9800; 
            border: none; border-radius: 12px; color: black; font-weight: bold; 
            margin-bottom: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <button id="installBtn">📲 INSTALLA APP</button>
    
    <h2>🎨 PaintCalc Pro</h2>

    <label>Metodo di Inserimento:</label>
    <div class="mode-selector">
        <button class="mode-btn active" id="btnDim" onclick="setMode('dims')">Dimensioni (m)</button>
        <button class="mode-btn" id="btnMq" onclick="setMode('mq')">MQ Totali</button>
    </div>

    <label>Prodotto:</label>
    <select id="prodotto" onchange="calcola()">
        <optgroup label="Resine Epofloor (KG)">
            <option value="0.5">Epofloor 810 (2 kg/mq)</option>
            <option value="2.5">Epofloor 830 (0.4 kg/mq)</option>
        </optgroup>
        <optgroup label="Vernici (Litri)">
            <option value="12">Smalto / Traspirante (12 mq/l)</option>
            <option value="10" selected>Lavabile Prof. (10 mq/l)</option>
            <option value="8">Antimuffa (8 mq/l)</option>
            <option value="6">Esterni / Quarzo (6 mq/l)</option>
        </optgroup>
    </select>

    <div id="divDims" class="row">
        <div style="flex:1">
            <label>Base (m):</label>
            <input type="number" id="larg" placeholder="es. 5" oninput="calcola()">
        </div>
        <div style="flex:1">
            <label>Altezza (m):</label>
            <input type="number" id="alt" placeholder="es. 3" oninput="calcola()">
        </div>
    </div>

    <div id="divMq" class="hidden">
        <label>Superficie Totale (mq):</label>
        <input type="number" id="mqTot" placeholder="es. 50" oninput="calcola()">
    </div>

    <label>Numero di mani:</label>
    <input type="number" id="mani" value="2" min="1" oninput="calcola()">

    <div class="result-area">
        <span id="labelTipo" style="font-size: 0.8em; text-transform: uppercase;">Fabbisogno Totale</span>
        <span class="result-val" id="risultato">0</span>
    </div>

    <div class="buckets-info" id="secchiInfo">
        Inserisci i dati per il calcolo.
    </div>
</div>

<script>
    let currentMode = 'dims';

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnDim').classList.toggle('active', mode === 'dims');
        document.getElementById('btnMq').classList.toggle('active', mode === 'mq');
        document.getElementById('divDims').classList.toggle('hidden', mode === 'mq');
        document.getElementById('divMq').classList.toggle('hidden', mode === 'dims');
        calcola();
    }

    function calcola() {
        const select = document.getElementById('prodotto');
        const resa = parseFloat(select.value); // mq/l o mq/kg
        const mani = parseFloat(document.getElementById('mani').value) || 1;
        
        let mq;
        if (currentMode === 'dims') {
            const l = parseFloat(document.getElementById('larg').value) || 0;
            const a = parseFloat(document.getElementById('alt').value) || 0;
            mq = l * a;
        } else {
            mq = parseFloat(document.getElementById('mqTot').value) || 0;
        }

        const isEpofloor = select.options[select.selectedIndex].text.includes("Epofloor");

        if (mq > 0) {
            let totale = (mq * mani) / resa;
            let unita = isEpofloor ? " KG" : " Litri";
            
            document.getElementById('risultato').innerText = totale.toFixed(2) + unita;
            
            let info = "<b>Consiglio:</b><br>";
            if (isEpofloor) {
                info += "• Totale miscela A+B: " + Math.ceil(totale) + " KG";
            } else {
                if (totale <= 2.5) info += "• 1 Barattolo da 2.5L";
                else if (totale <= 5) info += "• 1 Secchio da 5L";
                else info += "• " + Math.ceil(totale/14) + " Secchi da 14L";
            }
            document.getElementById('secchiInfo').innerHTML = info;
        } else {
            document.getElementById('risultato').innerText = "0";
            document.getElementById('secchiInfo').innerHTML = "Inserisci i dati necessari.";
        }
    }
