<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintCalc - La Tua Vernice</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d1b2">

    <style>
        /* Design moderno e touch-friendly */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        .app-container { max-width: 450px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        
        .logo-container img {
            max-width: 150px;
            height: auto;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        h2 { color: #00d1b2; margin-bottom: 25px; font-weight: 300; }
        
        label { display: block; margin-top: 20px; color: #888; font-size: 0.85em; text-align: left; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select { 
            width: 100%; padding: 15px; margin-top: 8px; 
            border-radius: 12px; border: 2px solid #333; background: #262626; 
            color: white; font-size: 1.1em; box-sizing: border-box; outline: none; transition: border-color 0.3s;
        }
        
        input:focus, select:focus { border-color: #00d1b2; }

        .row { display: flex; gap: 15px; }
        
        .sfrido-box { 
            margin-top: 25px; display: flex; align-items: center; 
            background: #262626; padding: 15px; border-radius: 12px; text-align: left; cursor: pointer;
        }
        
        .sfrido-box input[type="checkbox"] { width: 22px; height: 22px; margin-right: 15px; cursor: pointer; }

        .result-area { 
            margin-top: 30px; background: linear-gradient(135deg, #00d1b2, #009e86); color: #121212; 
            padding: 25px; border-radius: 15px; text-align: center; 
            font-size: 1.8em; font-weight: bold; box-shadow: 0 5px 15px rgba(0,209,178,0.3);
        }

        .footer-info { margin-top: 20px; font-size: 0.75em; color: #555; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>

    <h2>🎨 PaintCalc Pro</h2>

    <label>Seleziona Prodotto:</label>
    <select id="prodotto" onchange="calcola()">
        <option value="10">Idropittura Lavabile (10 mq/l)</option>
        <option value="12">Smalto all'acqua (12 mq/l)</option>
        <option value="8">Pittura Antimuffa (8 mq/l)</option>
        <option value="15">Fissativo / Primer (15 mq/l)</option>
    </select>

    <div class="row">
        <div style="flex:1">
            <label>Larghezza (m):</label>
            <input type="number" id="larg" placeholder="es. 4.5" oninput="calcola()">
        </div>
        <div style="flex:1">
            <label>Altezza (m):</label>
            <input type="number" id="alt" placeholder="es.
