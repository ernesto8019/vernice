<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintCalc Pro</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00d1b2">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        .app-container { max-width: 450px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h2 { color: #00d1b2; text-align: center; margin-top: 0; font-weight: 300; }
        
        /* Selettore Modalità */
        .mode-selector { display: flex; background: #262626; border-radius: 12px; margin-bottom: 25px; padding: 5px; border: 1px solid #444; }
        .mode-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 10px; transition: 0.3s; font-weight: bold; font-size: 0.9em; }
        .mode-btn.active { background: #00d1b2; color: #121212; box-shadow: 0 4px 10px rgba(0,209,178,0.2); }

        label { display: block; margin-top: 15px; color: #aaa; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select { 
            width: 100%; padding: 15px; margin-top: 8px; 
            border-radius: 12px; border: 2px solid #333; background: #262626; 
            color: white; font-size: 1.1em; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        
        input:focus { border-color: #00d1b2; background: #2a2a2a; }

        .row { display: flex; gap: 10px; }
        .hidden { display: none; }
        
        .result-area { 
            margin-top: 25px; background: linear-gradient(135deg, #00d1b2, #009e86); color: #121212; 
            padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,209,178,0.3);
        }

        .result-val { font-size: 2.2em; font-weight: bold; display: block; }
        
        .buckets-info {
            margin-top: 15px; padding: 15px; background: #262626; border-radius: 12px;
            font-size: 0.9em; border-left: 4px solid #ff9800; color: #ddd;
        }

        #installBtn { 
            display: none; width: 100%; padding: 15px; background: #ff9800; 
            border: none; border-radius: 12px; color: black; font-weight: bold; 
            margin-bottom: 20px; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="app-container">
    <button id="installBtn">📲 Installa l'App sul Telefono</button>
    
    <h2>🎨 PaintCalc Pro</h2>

    <label>Metodo di Misura:</label>
    <div class="mode-selector">
        <button class="mode-btn active" id="btnDim" onclick="setMode('dims')">Dimensioni (m)</button>
        <button class="mode-btn" id="btnMq" onclick="setMode('mq')">MQ Totali</button>
    </div>

    <label>Prodotto:</label>
    <select id="prodotto" onchange="calcola()">
        <optgroup label="Resine Epofloor (KG)">
            <option value="0.5">Epofloor 810 (Resa 2 kg/mq)</option>
            <option value="2.5">Epofloor 830 (Resa 0.4 kg/mq)</option>
        </optgroup>
        <optgroup label="Pitture e Vernici (L)">
            <option value="12">Smalto / Traspirante (12 mq/l)</option>
            <option value="10" selected>Lavabile Professionale (10 mq/l)</option>
            <option value="8">Antimuffa / Esterni (8 mq/l)</option>
        </optgroup>
    </select>

    <div id="divDims">
        <div class="row">
            <div style="flex:1">
                <label>Base / Larghezza (m):</label>
                <input type="number" id="larg" placeholder="es. 4" oninput="calcola()">
            </div>
            <div style="flex:1">
                <label>Altezza (m):</label>
                <input type="number" id="alt" placeholder="es. 3" oninput="calcola()">
            </div>
        </div>
    </div>

    <div id="divMq" class="hidden">
        <label
