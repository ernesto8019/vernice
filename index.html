<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintCalc Pro</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00d1b2">
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; text-align: center; }
        .app-container { max-width: 400px; margin: 20px auto; background: #1e1e1e; padding: 25px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        h2 { color: #00d1b2; font-weight: 300; margin-bottom: 25px; }

        .mode-selector { display: flex; background: #333; border-radius: 12px; margin-bottom: 25px; padding: 5px; }
        .mode-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .mode-btn.active { background: #00d1b2; color: #121212; }

        label { display: block; margin-top: 15px; color: #888; text-align: left; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 15px; margin-top: 5px; border-radius: 12px; border: none; background: #333; color: white; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { background: #444; border: 1px solid #00d1b2; }
        
        .row { display: flex; gap: 10px; }
        .hidden { display: none !important; }
        
        .result-area { margin-top: 30px; background: linear-gradient(135deg, #00d1b2, #009e86); color: #121212; padding: 25px; border-radius: 18px; }
        .result-val { font-size: 2.2em; font-weight: bold; display: block; }
        
        #installBtn { display: none; width: 100%; padding: 15px; background: #ff9800; border: none; border-radius: 12px; font-weight: bold; margin-bottom: 20px; color: black; cursor: pointer; }

        .footer-link { margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; }
        .footer-link a { color: #00d1b2; text-decoration: none; font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <button id="installBtn">📲 INSTALLA PAINTCALC PRO</button>
    
    <h2>🎨 PaintCalc Pro</h2>

    <div class="mode-selector">
        <button id="btnDim" class="mode-btn active" onclick="cambiaMode('dims')">Dimensioni (m)</button>
        <button id="btnMq" class="mode-btn" onclick="cambiaMode('mq')">MQ Totali</button>
    </div>

    <label>Seleziona Sistema:</label>
    <select id="prodotto" onchange="eseguiCalcolo()">
        <optgroup label="Sistemi EPOFLOOR">
            <option value="0.5">Epofloor 810 (2 kg/mq)</option>
            <option value="2.5">Epofloor 830 (0.4 kg/mq)</option>
        </optgroup>
        <optgroup label="Sistemi CERAMIFLOOR">
            <option value="4">Ceramifloor 900 (0.25 kg/mq)</option>
            <option value="4">Ceramifloor 910 (0.25 kg/mq)</option>
            <option value="4">Ceramifloor 920 (0.25 kg/mq)</option>
            <option value="4">Ceramifloor 930 (0.25 kg/mq)</option>
            <option value="4">Ceramifloor 940 (0.25 kg/mq)</option>
        </optgroup>
    </select>

    <div id="sezioneDims">
        <div class="row">
            <div style="flex:1">
                <label>Base (m):</label>
                <input type="number" id="inputLarg" placeholder="0" oninput="eseguiCalcolo()">
            </div>
