<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintCalc</title>
    
    <link rel="icon" href="data:,">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00d1b2">

    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; text-align: center; }
        .app-container { max-width: 400px; margin: 20px auto; background: #1e1e1e; padding: 20px; border-radius: 20px; border: 1px solid #333; }
        h2 { color: #00d1b2; }
        label { display: block; margin-top: 15px; color: #888; text-align: left; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: none; background: #333; color: white; box-sizing: border-box; }
        .result { margin-top: 20px; background: #00d1b2; color: #121212; padding: 20px; border-radius: 15px; font-size: 1.5em; font-weight: bold; }
        /* Tasto Installa (apparirà solo se possibile) */
        #installBtn { display: none; margin-top: 20px; padding: 10px; background: orange; border: none; border-radius: 10px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>🎨 PaintCalc</h2>
    
    <button id="installBtn">📲 INSTALLA APP</button>

    <label>Prodotto:</label>
    <select id="prodotto" onchange="calcola()">
        <option value="10">Lavabile (10 mq/l)</option>
        <option value="12">Smalto (12 mq/l)</option>
    </select>

    <label>Dimensioni (m):</label>
    <div style="display:flex; gap:10px;">
        <input type="number" id="larg" placeholder="Larg." oninput="calcola()">
        <input type="number" id="alt" placeholder="Alt." oninput="calcola()">
    </div>

    <div class="result" id="risultato">0 Litri</div>
</div>

<script>
    function calcola() {
        const resa = document.getElementById('prodotto').value;
        const larg = document.getElementById('larg').value || 0;
        const alt = document.getElementById('alt').value || 0;
        if (larg > 0 && alt > 0) {
            let litri = (larg * alt * 2) / resa;
            document.getElementById('risultato').innerText = litri.toFixed(2) + " Litri";
        }
    }

    // GESTIONE INSTALLAZIONE
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block'; // Mostra il tasto se l'app è installabile
    });

    installBtn.addEventListener('click', () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            });
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>
</body>
</html>
