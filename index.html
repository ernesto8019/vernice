<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintCalc Pro</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00d1b2">
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 20px; border: 1px solid #333; }
        h2 { color: #00d1b2; margin-bottom: 20px; }
        .selector { display: flex; background: #333; border-radius: 10px; padding: 5px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 10px; border: none; background: none; color: #888; cursor: pointer; font-weight: bold; border-radius: 8px; }
        .btn.active { background: #00d1b2; color: #121212; }
        label { display: block; text-align: left; margin-top: 15px; color: #aaa; font-size: 12px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: none; background: #333; color: white; box-sizing: border-box; font-size: 16px; }
        .result-box { margin-top: 25px; background: #00d1b2; color: #121212; padding: 20px; border-radius: 15px; }
        .result-val { font-size: 2.5em; font-weight: bold; display: block; }
        .footer { margin-top: 20px; padding-top: 10px; border-top: 1px solid #333; }
        .footer a { color: #00d1b2; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 PaintCalc Pro</h2>

    <div class="selector">
        <button id="b1" class="btn active" onclick="mostra('dims')">Dimensioni</button>
        <button id="b2" class="btn" onclick="mostra('mq')">MQ Totali</button>
    </div>

    <label>SISTEMA:</label>
    <select id="prodotto" onchange="calcola()">
        <optgroup label="EPOFLOOR">
            <option value="2.5">Epofloor 810 PRIMER (0,40 kg/mq)</option>
            <option value="0.5">Epofloor 810 MASSETTO (2 kg/mq)</option>
            <option value="2.5">Epofloor 830 (0.4 kg/mq)</option>
        </optgroup>
        <optgroup label="CERAMIFLOOR">
            <option value="10">Ceramifloor 900 PRIMER (0.100 kg/mq)</option>
            <option value="14.2857">Ceramifloor 900 ANTIPOLVERE (0.07 kg/mq)</option>
            <option value="4">Ceramifloor 910 (0.30 kg/mq)</option>
            <option value="4">Ceramifloor 920 (0.25 kg/mq)</option>
            <option value="4">Ceramifloor 930 (0.25 kg/mq)</option>
            <option value="4">Ceramifloor 940 (0.25 kg/mq)</option>
        </optgroup>
    </select>

    <div id="areaDims">
        <label>BASE (m):</label>
        <input type="number" id="base" value="0" oninput="calcola()">
        <label>ALTEZZA (m):</label>
        <input type="number" id="alt" value="0" oninput="calcola()">
    </div>

    <div id="areaMq" style="display:none">
        <label>MQ TOTALI:</label>
        <input type="number" id="mqtot" value="0" oninput="calcola()">
    </div>

    <label>MANI:</label>
    <input type="number" id="mani" value="1" oninput="calcola()">

    <div class="result-box">
        <span style="font-size: 11px; font-weight: bold;">FABBISOGNO TOTALE</span>
        <span id="risultato" class="result-val">0.00 KG</span>
    </div>

    <div class="footer">
        <a href="https://www.vibacolori.it" target="_blank">WWW.VIBACOLORI.IT</a>
    </div>
</div>

<script>
    var mode = 'dims';

    function mostra(tipo) {
        mode = tipo;
        document.getElementById('areaDims').style.display = (tipo === 'dims') ? 'block' : 'none';
        document.getElementById('areaMq').style.display = (tipo === 'mq') ? 'block' : 'none';
        document.getElementById('b1').className = (tipo === 'dims') ? 'btn active' : 'btn';
        document.getElementById('b2').className = (tipo === 'mq') ? 'btn active' : 'btn';
        calcola();
    }

    function calcola() {
        var resa = parseFloat(document.getElementById('prodotto').value);
        var nmani = parseFloat(document.getElementById('mani').value) || 0;
        var mq = 0;

        if (mode === 'dims') {
            var b = parseFloat(document.getElementById('base').value) || 0;
            var h = parseFloat(document.getElementById('alt').value) || 0;
            mq = b * h;
        } else {
            mq = parseFloat(document.getElementById('mqtot').value) || 0;
        }

        var res = (mq * nmani) / resa;
        document.getElementById('risultato').innerText = res.toFixed(2) + " KG";
    }
</script>
</body>
</html>
