<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PaintCalc Pro</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3593/3593594.png">
    <meta name="theme-color" content="#00d1b2">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: white; padding: 15px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        h2 { color: #00d1b2; margin-bottom: 20px; font-weight: 300; }
        .selector { display: flex; background: #333; border-radius: 10px; padding: 5px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border: none; background: none; color: #888; cursor: pointer; font-weight: bold; border-radius: 8px; transition: 0.3s; font-size: 14px; }
        .btn.active { background: #00d1b2; color: #121212; }
        label { display: block; text-align: left; margin-top: 15px; color: #aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: none; background: #333; color: white; box-sizing: border-box; font-size: 16px; outline: none; -webkit-appearance: none; }
        
        .switch-container { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; padding: 10px; background: #2a2a2a; border-radius: 10px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00d1b2; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        .result-box { margin-top: 25px; background: #00d1b2; color: #121212; padding: 15px; border-radius: 15px; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
        .result-val { font-size: 2.1em; font-weight: bold; display: block; }
        .pack-val { font-size: 1.1em; font-weight: bold; display: block; margin-top: 8px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 8px; color: #004d40; }
        
        .footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid #333; }
        .footer a { color: #00d1b2; text-decoration: none; font-weight: bold; font-size: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 PaintCalc Pro</h2>

    <div class="selector">
        <button id="b1" class="btn active" onclick="mostra('dims')">Dimensioni</button>
        <button id="b2" class="btn" onclick="mostra('mq')">MQ Totali</button>
    </div>

    <label id="labelProdotto">SISTEMA / PRODOTTO:</label>
    <select id="prodotto" onchange="calcola()">
        <optgroup label="EPOFLOOR">
            <option value="0.40" data-unit="KG">Epofloor 810 PRIMER (0.40 kg/mq)</option>
            <option value="2.00" data-unit="KG">Epofloor 810 MASSETTO (2.00 kg/mq)</option>
            <option value="0.40" data-unit="KG">Epofloor 830 (0.40 kg/mq)</option>
        </optgroup>
        <optgroup label="CERAMIFLOOR">
            <option value="0.10" data-unit="KG">Ceramifloor 900 PRIMER (0.10 kg/mq)</option>
            <option value="0.07" data-unit="KG">Ceramifloor 900 ANTIPOLVERE (0.07 kg/mq)</option>
            <option value="0.30" data-unit="KG">Ceramifloor 910 (0.30 kg/mq)</option>
            <option value="0.25" data-unit="KG">Ceramifloor 920 (0.25 kg/mq)</option>
            <option value="0.25" data-unit="KG">Ceramifloor 930 (0.25 kg/mq)</option>
            <option value="0.25" data-unit="KG">Ceramifloor 940 (0.25 kg/mq)</option>
        </optgroup>
        <optgroup label="EDILIZIA">
            <option value="0.12" data-unit="LT">Smalto 3 Archi (0.12 lt/mq)</option>
            <option value="0.10" data-unit="LT">Trasp. Eko (0.10 lt/mq)</option>
            <option value="0.10" data-unit="LT">Trasp. Fiorella (0.10 lt/mq)</option>
            <option value="0.14" data-unit="LT">Lav. Int. Bravo (0.14 lt/mq)</option>
            <option value="0.14" data-unit="LT">Lav. Est. Bellissima (0.14 lt/mq)</option>
            <option value="0.30" data-unit="KG">Murosil (0.30 kg/mq)</option>
        </optgroup>
    </select>

    <div class="switch-container">
        <span style="font-size: 11px; color: #aaa;">PERSONALIZZA CONSUMO</span>
        <label class="switch">
            <input type="checkbox" id="flagResa" onchange="toggleResa()">
            <span class="slider"></span>
        </label>
    </div>

    <div id="customResaBox" class="hidden">
        <label>NUOVO CONSUMO (kg o lt / mq):</label>
        <input type="number" id="customResa" step="0.01" placeholder="es. 0.35" inputmode="decimal" oninput="calcola()">
    </div>

    <div id="areaDims">
        <label>BASE (m):</label>
        <input type="number" id="base" placeholder="0" inputmode="decimal" oninput="calcola()">
        <label>ALTEZZA (m):</label>
        <input type="number" id="alt" placeholder="0" inputmode="decimal" oninput="calcola()">
    </div>

    <div id="areaMq" class="hidden">
        <label>MQ TOTALI:</label>
        <input type="number" id="mqtot" placeholder="0" inputmode="decimal" oninput="calcola()">
    </div>

    <label>MANI:</label>
    <input type="number" id="mani" value="1" min="1" inputmode="numeric" oninput="calcola()">

    <div class="result-box">
        <span style="font-size: 10px; font-weight: bold; text-transform: uppercase;">Fabbisogno Totale</span>
        <span id="risultato" class="result-val">0.00 KG</span>
        <span id="confezioni" class="pack-val hidden">📦 0 Confezioni</span>
    </div>

    <div class="footer">
        <a href="https://www.vibacolori.it" target="_blank">WWW.VIBACOLORI.IT</a>
    </div>
</div>

<script>
    var mode = 'dims';

    function mostra(tipo) {
        mode = tipo;
        document.getElementById('areaDims').style.display = (tipo === 'dims') ? 'block' : 'none';
        document.getElementById('areaMq').classList.toggle('hidden', tipo !== 'mq');
        document.getElementById('b1').className = (tipo === 'dims') ? 'btn active' : 'btn';
        document.getElementById('b2').className = (tipo === 'mq') ? 'btn active' : 'btn';
        calcola();
    }

    function toggleResa() {
        var isCustom = document.getElementById('flagResa').checked;
        var box = document.getElementById('customResaBox');
        var sel = document.getElementById('prodotto');
        if (isCustom) {
            box.classList.remove('hidden');
            sel.disabled = true;
            sel.style.opacity = "0.3";
        } else {
            box.classList.add('hidden');
            sel.disabled = false;
            sel.style.opacity = "1";
        }
        calcola();
    }

    function calcola() {
        var isCustom = document.getElementById('flagResa').checked;
        var selectProd = document.getElementById('prodotto');
        var consumoMq;
        var unita = "KG"; // Default
        
        var selectedOption = selectProd.options[selectProd.selectedIndex];
        var nomeProdotto = selectedOption.text;
        var is830 = nomeProdotto.includes("830") && !isCustom;

        if (isCustom) {
            consumoMq = parseFloat(document.getElementById('customResa').value) || 0;
            unita = "KG/LT";
        } else {
            consumoMq = parseFloat(selectProd.value);
            unita = selectedOption.getAttribute('data-unit');
        }

        var nmani = parseFloat(document.getElementById('mani').value) || 0;
        var mq = 0;

        if (mode === 'dims') {
            var b = parseFloat(document.getElementById('base').value) || 0;
            var h = parseFloat(document.getElementById('alt').value) || 0;
            mq = b * h;
        } else {
            mq = parseFloat(document.getElementById('mqtot').value) || 0;
        }

        var totale = mq * nmani * consumoMq;
        document.getElementById('risultato').innerText = totale.toFixed(2) + " " + unita;
        
        var divConf = document.getElementById('confezioni');
        if (is830 && totale > 0) {
            var numConfezioni = Math.ceil(totale / 24);
            divConf.innerText = "📦 " + numConfezioni + " Conf. da 24 KG";
            divConf.classList.remove('hidden');
        } else {
            divConf.classList.add('hidden');
        }
    }
</script>
</body>
</html>
