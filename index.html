<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintCalc Pro</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00d1b2">
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; text-align: center; }
        .app-container { max-width: 400px; margin: 20px auto; background: #1e1e1e; padding: 20px; border-radius: 20px; border: 1px solid #333; }
        
        /* Selettore Modalità */
        .mode-selector { display: flex; background: #333; border-radius: 10px; margin-bottom: 20px; padding: 5px; }
        .mode-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .mode-btn.active { background: #00d1b2; color: #121212; }

        label { display: block; margin-top: 15px; color: #888; text-align: left; font-size: 0.8em; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: none; background: #333; color: white; box-sizing: border-box; font-size: 16px; }
        
        .row { display: flex; gap: 10px; }
        .hidden { display: none !important; }
        
        .result-area { margin-top: 25px; background: #00d1b2; color: #121212; padding: 20px; border-radius: 15px; }
        .result-val { font-size: 2em; font-weight: bold; display: block; }
        
        #installBtn { display: none; width: 100%; padding: 15px; background: orange; border: none; border-radius: 12px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <button id="installBtn">📲 INSTALLA APP</button>
    <h2>🎨 PaintCalc Pro</h2>

    <div class="mode-selector">
        <button id="btnDim" class="mode-btn active" onclick="cambiaMode('dims')">Dimensioni (m)</button>
        <button id="btnMq" class="mode-btn" onclick="cambiaMode('mq')">MQ Totali</button>
    </div>

    <label>Prodotto:</label>
    <select id="prodotto" onchange="eseguiCalcolo()">
        <option value="0.5">Epofloor 810 (2 kg/mq)</option>
        <option value="2.5">Epofloor 830 (0.4 kg/mq)</option>
        <option value="10" selected>Lavabile (10 mq/l)</option>
        <option value="12">Smalto (12 mq/l)</option>
    </select>

    <div id="sezioneDims">
        <div class="row">
            <div style="flex:1">
                <label>Base (m):</label>
                <input type="number" id="inputLarg" placeholder="0" oninput="eseguiCalcolo()">
            </div>
            <div style="flex:1">
                <label>Altezza (m):</label>
                <input type="number" id="inputAlt" placeholder="0" oninput="eseguiCalcolo()">
            </div>
        </div>
    </div>

    <div id="sezioneMq" class="hidden">
        <label>Superficie Totale (mq):</label>
        <input type="number" id="inputMqTot" placeholder="es. 50" oninput="eseguiCalcolo()">
    </div>

    <label>Numero di mani:</label>
    <input type="number" id="inputMani" value="2" oninput="eseguiCalcolo()">

    <div class="result-area">
        <span style="font-size: 0.8em; text-transform: uppercase;">Totale Necessario</span>
        <span class="result-val" id="testoRisultato">0</span>
    </div>
</div>

<script>
    let modalitaAttuale = 'dims';

    function cambiaMode(m) {
        modalitaAttuale = m;
        // Gestione tasti
        document.getElementById('btnDim').classList.toggle('active', m === 'dims');
        document.getElementById('btnMq').classList.toggle('active', m === 'mq');
        // Gestione visibilità campi
        document.getElementById('sezioneDims').classList.toggle('hidden', m === 'mq');
        document.getElementById('sezioneMq').classList.toggle('hidden', m === 'dims');
        eseguiCalcolo();
    }

    function eseguiCalcolo() {
        const resa = parseFloat(document.getElementById('prodotto').value);
        const mani = parseFloat(document.getElementById('inputMani').value) || 1;
        let mq = 0;

        if (modalitaAttuale === 'dims') {
            const l = parseFloat(document.getElementById('inputLarg').value) || 0;
            const a = parseFloat(document.getElementById('inputAlt').value) || 0;
            mq = l * a;
        } else {
            mq = parseFloat(document.getElementById('inputMqTot').value) || 0;
        }

        const nomeProd = document.getElementById('prodotto').options[document.getElementById('prodotto').selectedIndex].text;
        const unita = nomeProd.includes("Epofloor") ? " KG" : " Litri";

        if (mq > 0) {
            let totale = (mq * mani) / resa;
            document.getElementById('testoRisultato').innerText = totale.toFixed(2) + unita;
        } else {
            document.getElementById('testoRisultato').innerText = "0" + unita;
        }
    }

    // PWA
    let scattoInstallazione;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        scattoInstallazione = e;
        document.getElementById('installBtn').style.display = 'block';
    });

    document.getElementById('installBtn').addEventListener('click', () => {
        if (scattoInstallazione) {
            scattoInstallazione.prompt();
            scattoInstallazione.userChoice.then(() => {
                document.getElementById('installBtn').style.display = 'none';
                scattoInstallazione = null;
            });
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>
</body>
</html>
